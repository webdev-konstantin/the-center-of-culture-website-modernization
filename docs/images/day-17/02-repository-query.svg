<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="363" viewBox="0 0 1200 363"><rect width="100%" height="100%" rx="16" fill="#1e1e1e"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">repository-query.php</text><text x="48" y="92" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">$dateExpression = $collectionKey === &#x27;events&#x27;</text><text x="48" y="126" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">  ? &#x27;COALESCE(event_start, publication_date)&#x27;</text><text x="48" y="160" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">  : &#x27;publication_date&#x27;;</text><text x="48" y="194" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">$whereParts[] = &#x27;(title LIKE ? OR subtitle LIKE ?&#x27;</text><text x="48" y="228" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">  . &#x27; OR tags LIKE ? OR event_location LIKE ?)&#x27;;</text><text x="48" y="262" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">$sql .= &#x27; LIMIT ? OFFSET ?&#x27;;</text></svg>