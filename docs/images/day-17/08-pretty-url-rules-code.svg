<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Day 17 — Apache pretty URL rules</title>
  <desc id="desc">Full-size code panel containing the public rewrite rules used for the News and Media page, repositories, and publication slug route. Infrastructure paths are omitted.</desc>
  <rect width="1400" height="650" rx="18" fill="#111827"/>
  <rect x="28" y="28" width="1344" height="594" rx="12" fill="#1f2937" stroke="#374151"/>
  <text x="62" y="82" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f9fafb">.htaccess — публичные маршруты / public routes</text>
  <text x="62" y="126" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">Серверные пути и данные авторизации исключены из документации</text>
  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#d1d5db">
    <text x="62" y="190" fill="#6ee7b7">RewriteEngine On</text>
    <text x="62" y="245" fill="#93c5fd">RewriteRule ^(ru|hu)/media/?$</text>
    <text x="94" y="282">media.php?locale=$1 [L,QSA,NC]</text>
    <text x="62" y="342" fill="#93c5fd">RewriteRule ^(ru|hu)/news/?$</text>
    <text x="94" y="379">repository.php?collection=news&amp;locale=$1 [L,QSA,NC]</text>
    <text x="62" y="439" fill="#93c5fd">RewriteRule ^(ru|hu)/events/?$</text>
    <text x="94" y="476">repository.php?collection=events&amp;locale=$1 [L,QSA,NC]</text>
    <text x="62" y="536" fill="#93c5fd">RewriteRule ^(ru|hu)/news/([a-z0-9-]+)/?$</text>
    <text x="94" y="573">news.php?locale=$1&amp;slug=$2 [L,QSA,NC]</text>
  </g>
</svg>