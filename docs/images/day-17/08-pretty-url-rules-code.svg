<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" rx="18" fill="#1e1e1e"/>
  <rect x="0" y="0" width="1400" height="58" rx="18" fill="#2b2b2b"/>
  <circle cx="28" cy="29" r="8" fill="#ff5f57"/>
  <circle cx="52" cy="29" r="8" fill="#febc2e"/>
  <circle cx="76" cy="29" r="8" fill="#28c840"/>
  <text x="108" y="37" font-family="Arial, sans-serif" font-size="22" fill="#f3f4f6">.htaccess — pretty URL rules</text>
  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23">
    <text x="44" y="105" fill="#6a9955"># Shared News and Media overview</text>
    <text x="44" y="145" fill="#dcdcaa">RewriteRule</text><text x="205" y="145" fill="#ce9178"> ^(ru|hu)/media/?$</text><text x="520" y="145" fill="#d4d4d4"> media.php?locale=$1 [L,QSA,NC]</text>
    <text x="44" y="205" fill="#6a9955"># Full news repository</text>
    <text x="44" y="245" fill="#dcdcaa">RewriteRule</text><text x="205" y="245" fill="#ce9178"> ^(ru|hu)/news/?$</text><text x="500" y="245" fill="#d4d4d4"> repository.php?collection=news&amp;locale=$1 [L,QSA,NC]</text>
    <text x="44" y="305" fill="#6a9955"># Announcements and international events</text>
    <text x="44" y="345" fill="#dcdcaa">RewriteRule</text><text x="205" y="345" fill="#ce9178"> ^(ru|hu)/events/?$</text><text x="520" y="345" fill="#d4d4d4"> repository.php?collection=events&amp;locale=$1 [L,QSA,NC]</text>
    <text x="44" y="405" fill="#6a9955"># Detailed publication</text>
    <text x="44" y="445" fill="#dcdcaa">RewriteRule</text><text x="205" y="445" fill="#ce9178"> ^(ru|hu)/news/([a-z0-9-]+)/?$</text><text x="710" y="445" fill="#d4d4d4"> news.php?locale=$1&amp;slug=$2 [L,QSA,NC]</text>
  </g>
</svg>