<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="295" viewBox="0 0 1200 295"><rect width="100%" height="100%" rx="16" fill="#1e1e1e"/><text x="48" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">.htaccess</text><text x="48" y="92" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">RewriteRule ^(ru|hu)/media/?$ media.php?locale=$1 [L,QSA,NC]</text><text x="48" y="126" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">RewriteRule ^(ru|hu)/news/?$ repository.php?collection=news&amp;locale=$1 [L,QSA,NC]</text><text x="48" y="160" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">RewriteRule ^(ru|hu)/events/?$ repository.php?collection=events&amp;locale=$1 [L,QSA,NC]</text><text x="48" y="194" font-family="DejaVu Sans Mono,monospace" font-size="22" fill="#d4d4d4">RewriteRule ^(ru|hu)/news/([a-z0-9-]+)/?$ news.php?locale=$1&amp;slug=$2 [L,QSA,NC]</text></svg>